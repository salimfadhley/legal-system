# Container-tuned projects config for the ingest service running INSIDE the stack.
# Mounted at /etc/goldberg/projects.yaml and selected via GOLDBERG_PROJECTS_CONFIG.
# Paths are the in-CONTAINER mount points, not host paths (ADR 0012).
root: /data

projects:
  system:
    path: /app                 # config dir mounted at /app/config (manifest lives here)
    role: code — the pipeline and tooling
  raw:
    path: /data/goldberg-raw   # goldberg-raw bind-mounted read-only (incl. .git)
    role: immutable original documents
