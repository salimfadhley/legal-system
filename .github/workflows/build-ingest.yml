name: build-ingest

# Build the ingest-service image on GitHub's runners and push it to ghcr, so Halob
# (a low-spec Celeron) only ever *pulls* a pre-built linux/amd64 image and never builds.
# The push side needs no secret to manage — the built-in GITHUB_TOKEN authenticates to
# ghcr. Deployment (Portainer pulling this image) is wired separately.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "deploy/Dockerfile.ingest"
      - "pyproject.toml"
      - ".github/workflows/build-ingest.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.ingest
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/salimfadhley/goldberg-ingest:latest
            ghcr.io/salimfadhley/goldberg-ingest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
